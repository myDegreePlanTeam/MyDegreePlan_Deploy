server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;

    # Docker's embedded DNS. Using variables in proxy_pass below makes nginx
    # re-resolve, so restarting the rest/auth containers does not cause 502s.
    resolver 127.0.0.11 valid=10s ipv6=off;

    client_max_body_size 1m;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Generated at start-up by 40-mdp-config.sh; must never be cached.
    location = /config.js {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    # supabase-js calls <origin>/rest/v1/... and <origin>/auth/v1/...
    location /rest/v1/ {
        set $upstream http://rest:3000;
        rewrite ^/rest/v1/(.*)$ /$1 break;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /auth/v1/ {
        set $upstream http://auth:9999;
        rewrite ^/auth/v1/(.*)$ /$1 break;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # In-app updates. The updater checks the login token and that Host/Origin are this
    # install's own local address, so Host is passed through with its port.
    location /_mdp/update/ {
        set $upstream http://updater:8090;
        rewrite ^/_mdp/update/(.*)$ /$1 break;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 2k;
        add_header Cache-Control "no-store" always;
    }

    # The React app. Unknown paths fall back to index.html (client-side routing).
    # The CSP is the enforcement half of the privacy promise: the page may only
    # talk to this same origin, so even a future code change cannot quietly send
    # student data to another host. 'blob:' / wasm are for the PDF export.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' blob: data:; worker-src 'self' blob:; frame-src 'self' blob:; object-src 'self' blob:; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    }
}
