# Fast checks on every push and PR. The updater holds the Docker socket, so its tests
# and the release tooling's tests are worth running on every change.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Updater
        working-directory: updater
        run: npm test
      - name: Release tooling
        working-directory: release-tools
        run: npm ci && npm test
      - name: Launcher scripts parse
        run: sh -n mdp.sh && bash -n release-tools/preflight.sh
      - name: Workspace tools
        run: |
          node --test tools/test_json_patch.mjs
          python3 -m unittest tools/test_multi_replace.py
          bash tools/test_finish_pr.sh
      - name: Updater image builds
        run: docker build -t mdp-updater-ci updater
